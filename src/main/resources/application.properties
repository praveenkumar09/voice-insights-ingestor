# ── PostgreSQL / pgvector (shared server with cobol-ingestor-api / cobalt-rag-api,
#    own schema — see db.pg.schema) ──────────────────────────────────────────────
db.pg.host=localhost
db.pg.port=5432
db.pg.name=ingestor
db.pg.user=admin
db.pg.pass=admin
db.pg.schema=voice_insights

# ── OpenAI ────────────────────────────────────────────────────────────────────
openai.embed.model=text-embedding-3-large
openai.embed.dims=3072
openai.embed.batch-size=50
openai.embed.url=https://api.openai.com/v1/embeddings

# ── Ingestion ─────────────────────────────────────────────────────────────────
# Chunk size cap (characters) before a section is split further; overlap carries
# the last paragraph of a chunk into the next one for continuity.
ingest.chunk.max-chars=1500
